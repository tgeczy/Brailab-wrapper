# The BraiLab voices (sd_brailab).
#
#   BraiLab PC          the BraiLab PC itself: its own 1991 program, TALKHUN, running on an emulated 8086 and
#                       speaking through a model of its speech chip, the Philips PCF8200
#   BraiLab PC furcsa   the same with the chip's other voice table: TALKHUN's "furcsa" (weird) voice
#   BraiLab TTS         the later software voice, when its optional plug-in is installed (install.sh --with-tts)
#
# Choose one in Orca (Preferences, Speech, Voice) or with  spd-say -o brailab -y "BraiLab PC furcsa".
# Rate, pitch and volume come from Orca or spd-say.
#
# This file:      speech-dispatcher's modules folder (install.sh put it there and wrote BrailabDataDir below).
# Your own copy:  ~/.config/brailab/sd_brailab.conf -- any line there wins over this file, needs no root, and
#                 survives reinstalling.  Same keys, same format.
#
# Uncomment a line and change it to override the default.
# After editing:  killall speech-dispatcher     (Orca reconnects by itself)

# The BraiLab PC's sentence melody: 1 on (default), 0 off (each clause held at the pitch it starts on).
# BrailabIntonation 1

# The BraiLab TTS plug-in, when it is somewhere other than the data folder.  Without the plug-in this line is
# ignored and the module is the two BraiLab PC voices.
# BrailabTtsPlugin "/path/to/libbrailab_tts.so"
