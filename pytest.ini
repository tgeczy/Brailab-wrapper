# The packages live in src/: this is what lets a test say "from pcf8200 import ..." from the repository root.
# testpaths: a bare `pytest` runs the pcf8200 and klatt suites.  talkhun_emu's runs on its own
# (python -m pytest src/talkhun_emu/tests), as CI runs it: its tests put src/talkhun_emu first on the
# path, where an older pcf8200.py of its own shadows the package, so the two cannot share one process
# (PORTING.md).  norecursedirs: local build output holds copies of the sources and their tests (#48).
[pytest]
pythonpath = src
testpaths = src/pcf8200/tests src/klatt/tests
norecursedirs = .* build dist release portable_build _bin __pycache__ node_modules
