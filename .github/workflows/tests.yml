name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pcf8200:
    name: pcf8200 (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the NVDA-compatible floor; 3.13 covers newer local dev
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The library is deliberately pure-numpy: no scipy, so it can be vendored
      # into an NVDA add-on without dragging in a compiled stack.
      - name: Install dependencies
        run: pip install pytest numpy

      - name: Run the pcf8200 suite on the Python reference
        run: python -m pytest pcf8200/tests -v
        env:
          PCF8200_BACKEND: python

      # test_native.py is what holds the C to the reference; without the library
      # it skips, so build it first and force the backend.
      - name: Build the C core
        run: python pcf8200/csrc/build_native.py

      - name: Run the pcf8200 suite on the C core
        run: python -m pytest pcf8200/tests -v
        env:
          PCF8200_BACKEND: native

      # The Klatt synthesizer: C only, tested against what the papers predict.
      - name: Build the Klatt synthesizer
        run: python klatt/csrc/build_native.py

      - name: Run the klatt suite
        run: python -m pytest klatt/tests -v

      # The voice's tests need TALKHUN0, so they skip here, but it must still build.
      - name: Build the voice
        run: python talkhun_emu/csrc/build_native.py

      # The speech-dispatcher module must build, and its loading of an optional voice
      # plug-in is tested with a stand-in, which needs no TALKHUN0 either.
      - name: Build the speech-dispatcher module
        run: sh speechd/build_linux.sh

      - name: Run the module's plug-in tests
        run: >
          python speechd/test_sd_plugin.py build/linux/sd_brailab
          build/linux/test/libbrailab_tts.so build/linux/test/libbrailab_tts_other.so

      # chip_synth's pitch control, which NVDA's capital pitch change rides on.
      # Needs numpy only -- the sequences are built in the tests rather than
      # captured, so no Unicorn and no TALKHUN.
      - name: Run the chip_synth suite
        run: python -m pytest talkhun_emu/tests -v

      - name: The examples must still run
        run: |
          cd pcf8200/examples
          for f in *.py; do echo "-- $f"; python "$f" >/dev/null; done

      # numpy only. If scipy ever creeps back in, the add-on grows by ~30 MB.
      - name: Check the library imports without scipy
        run: |
          python - <<'PY'
          import sys
          class Blocked:
              def find_module(self, name, path=None):
                  if name == "scipy" or name.startswith("scipy."):
                      raise ImportError("scipy must not be required by pcf8200")
          sys.meta_path.insert(0, Blocked())
          from pcf8200 import PCF8200, Voice, protocol, tables
          chip = PCF8200(voice="male")
          chip.pitch_hz(110)
          chip.frame_codes(F1=22, F2=13, F3=4, AM=13, PI=2, FD=1)
          chip.frame_codes(F1=22, F2=13, F3=4, AM=13, PI=2, FD=1)
          assert len(chip.render()) > 0
          print("pcf8200 imports and renders with scipy blocked")
          PY
