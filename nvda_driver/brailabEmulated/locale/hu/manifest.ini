summary = "BraiLab PC (emulált, PCF8200)"
description = """Teljesen emulált BraiLab PC magyar beszédszintetizátor. Az eredeti, 1991-es TALKHUN program egy emulált 8086-os processzoron fut, és a Philips PCF8200 formánsszintetizátor-chip újonnan megírt szoftveres modelljét vezérli, amelyet fül és mérés alapján egy valódi PCF8200 chiphez igazítottunk. Sem hardver, sem gyártói program nem kell hozzá. Visszahozza a FURCSA hangot, amely a TTS.dll-es változatból kimaradt, és kezeli a hangmagasságot, az NVDA nagybetűknél használt hangmagasság-változtatását is. Arató András és a KFKI munkáján alapul."""
