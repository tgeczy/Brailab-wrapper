name = brailabEmulated
summary = "BraiLab PC (emulated, PCF8200)"
description = """Fully emulated BraiLab PC Hungarian speech synthesizer. The original 1991 TALKHUN engine runs under a CPU emulator (Unicorn), feeding a from-scratch software model of the Philips PCF8200 formant chip -- matched by ear and by measurement to real PCF8200 silicon. No hardware and no vendor binary required. Adds the FURCSA (weird voice) effect that the TTS.dll build lost. Based on the work of Arató András and the KFKI."""
author = "Tamás Géczy, Claude"
url = https://github.com/tgeczy/Brailab-wrapper
version = 3.0.4
minimumNVDAVersion = 2024.4
lastTestedNVDAVersion = 2026.2
